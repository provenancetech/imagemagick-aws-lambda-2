name: Build and push toolchain base image

permissions:
  contents: read
  id-token: write
  actions: read

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - Dockerfile.base
      - Makefile
      - Makefile_ImageMagick
      - .github/workflows/base-image.yml
      - .github/workflows/bin/verify-layer.sh
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pinned version tag for the base image (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

env:
  AWS_REGION: us-west-2
  BASE_REPOSITORY: provenancetech/tools/imagemagick-lambda-base

jobs:
  # The arm64 toolchain compiles natively on a self-hosted Graviton runner
  # (same start/build/stop pattern the rest of the fleet builds images with)
  # instead of QEMU emulation on a hosted amd64 runner.
  start-runner:
    name: Start self-hosted EC2 runner
    runs-on: ubuntu-24.04
    if: github.actor != 'dependabot[bot]'
    outputs:
      label: ${{ steps.start-ec2-runner.outputs.label }}
      ec2-instance-id: ${{ steps.start-ec2-runner.outputs.ec2-instance-id }}
    steps:
      # A public repository cannot reference an action hosted in a private
      # one (GitHub's rule: private actions are for private repos of the org
      # only) - hence the checkout + local path below instead of a direct
      # `uses: provenancetech/ec2-github-runner@...`. Needs CI_TOKEN (repo
      # secret) both to read the private action repo and for the runner
      # registration token the action itself consumes.
      - name: Checkout the runner action
        uses: actions/checkout@v7
        with:
          repository: provenancetech/ec2-github-runner
          ref: v2.3.7
          token: ${{ secrets.CI_TOKEN }}
          path: ec2-github-runner

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::210944367560:role/github-actions-oidc
          aws-region: us-west-2

      - name: Start EC2 runner
        id: start-ec2-runner
        uses: ./ec2-github-runner
        with:
          mode: start
          github-token: ${{ secrets.CI_TOKEN }}
          ec2-try-spot-first: false
          ec2-launch-params: |
            ImageId: ami-0e5a8852d22abdb12
            InstanceType: m6g.xlarge
            SecurityGroupIds: [ sg-0c89ec3b538c5a154 ]
            BlockDeviceMappings:
            - DeviceName: "/dev/sda1"
              Ebs:
                VolumeSize: 32

  build:
    name: Compile, verify and publish arm64 base image
    needs: [ start-runner ]
    if: github.actor != 'dependabot[bot]'
    runs-on: ${{ needs.start-runner.outputs.label }}
    timeout-minutes: 60

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7

      # Same self-bootstrap as every other EC2-runner job in the fleet (the
      # AMI is minimal): make drives the compile, docker builds/pushes the
      # image, git/curl/awscli are the usual suspects.
      - name: Update OS
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl make docker.io awscli

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::210944367560:role/github-actions-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Compile and verify arm64 toolchain
        shell: bash
        run: |
          make clean
          make all DOCKER_PLATFORM=linux/arm64
          .github/workflows/bin/verify-layer.sh linux/arm64

      - name: Login to dev registry
        id: dev-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push base image to dev
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag || '2.0.0' }}"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          REGISTRY="${{ steps.dev-login.outputs.registry }}"
          make base-image \
            DOCKER_PLATFORM=linux/arm64 \
            BASE_IMAGE_NAME="$REGISTRY/$BASE_REPOSITORY" \
            BASE_IMAGE_TAG="$VERSION_TAG"
          docker push "$REGISTRY/$BASE_REPOSITORY:$VERSION_TAG"
          # The sha tag keeps the exact source commit traceable after the
          # pinned tag is rebuilt.
          docker tag "$REGISTRY/$BASE_REPOSITORY:$VERSION_TAG" "$REGISTRY/$BASE_REPOSITORY:$SHA_TAG"
          docker push "$REGISTRY/$BASE_REPOSITORY:$SHA_TAG"

      - name: Trigger image sanitizer rebuild in pti-infra
        # The image sanitizer function image COPYs /opt out of this base
        # image, so a base rebuild must refresh it even though the change
        # lives in this repository - on.push.paths cannot see across repos,
        # and pti-infra therefore listens for this repository_dispatch
        # (build-image-sanitizer.yml) instead. github-script rather than gh:
        # this step runs on the self-hosted runner, where the CLI may be
        # absent, and the org token (not the repo-scoped GITHUB_TOKEN) is
        # required to dispatch into another repository.
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CI_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'provenancetech',
              repo: 'pti-infra',
              event_type: 'base-image-updated',
              client_payload: {
                version_tag: '${{ github.event.inputs.tag || '2.0.0' }}',
                sha: context.sha,
              },
            });
            core.info('Dispatched base-image-updated to provenancetech/pti-infra');

  stop-runner:
    name: Stop self-hosted EC2 runner
    needs:
      - start-runner
      - build
    runs-on: ubuntu-24.04
    # Stop the runner even if the build failed, so a broken build never
    # leaves an instance running.
    if: ${{ always() && github.actor != 'dependabot[bot]' }}
    steps:
      # Same vendoring as start-runner: a public repo cannot reference the
      # private provenancetech/ec2-github-runner action directly.
      - name: Checkout the runner action
        uses: actions/checkout@v7
        with:
          repository: provenancetech/ec2-github-runner
          ref: v2.3.7
          token: ${{ secrets.CI_TOKEN }}
          path: ec2-github-runner

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::210944367560:role/github-actions-oidc
          aws-region: us-west-2

      - name: Stop EC2 runner
        uses: ./ec2-github-runner
        with:
          mode: stop
          github-token: ${{ secrets.CI_TOKEN }}
          label: ${{ needs.start-runner.outputs.label }}
          ec2-instance-id: ${{ needs.start-runner.outputs.ec2-instance-id }}
