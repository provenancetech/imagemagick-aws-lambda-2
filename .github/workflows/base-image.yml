name: Build and push toolchain base image

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - Dockerfile.base
      - Makefile
      - Makefile_ImageMagick
      - .github/workflows/base-image.yml
      - .github/workflows/bin/verify-layer.sh
  workflow_dispatch:
    inputs:
      tag:
        description: 'Pinned version tag for the base image (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

env:
  AWS_REGION: us-west-2
  BASE_REPOSITORY: provenancetech/tools/imagemagick-lambda-base

jobs:
  build:
    name: Compile, verify and publish arm64 base image
    runs-on: ubuntu-latest
    # The arm64 toolchain compiles under QEMU emulation on this amd64 runner
    # and is several times slower than a native build (~4 min native).
    timeout-minutes: 180

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v7

      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure dev AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::210944367560:role/github-actions-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Compile and verify arm64 toolchain
        shell: bash
        run: |
          make clean
          make all DOCKER_PLATFORM=linux/arm64
          .github/workflows/bin/verify-layer.sh linux/arm64

      - name: Login to dev registry
        id: dev-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push base image to dev
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag || '2.0.0' }}"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          REGISTRY="${{ steps.dev-login.outputs.registry }}"
          make base-image \
            DOCKER_PLATFORM=linux/arm64 \
            BASE_IMAGE_NAME="$REGISTRY/$BASE_REPOSITORY" \
            BASE_IMAGE_TAG="$VERSION_TAG"
          docker push "$REGISTRY/$BASE_REPOSITORY:$VERSION_TAG"
          # The sha tag keeps the exact source commit traceable after the
          # pinned tag is rebuilt.
          docker tag "$REGISTRY/$BASE_REPOSITORY:$VERSION_TAG" "$REGISTRY/$BASE_REPOSITORY:$SHA_TAG"
          docker push "$REGISTRY/$BASE_REPOSITORY:$SHA_TAG"

      # The function image is built per target account at deploy time and its
      # Dockerfile pulls the base from the registry of that account, so every
      # account needs its own copy. Copying (rather than rebuilding) keeps all
      # three byte-identical.
      - name: Configure staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::888736119939:role/github-actions-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish base image to staging ECR
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names "$BASE_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 ||
            aws ecr create-repository --repository-name "$BASE_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to staging registry
        id: staging-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy base image to staging
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag || '2.0.0' }}"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          DEV_REG="${{ steps.dev-login.outputs.registry }}"
          DST_REG="${{ steps.staging-login.outputs.registry }}"
          docker buildx imagetools create \
            -t "$DST_REG/$BASE_REPOSITORY:$VERSION_TAG" \
            "$DEV_REG/$BASE_REPOSITORY:$VERSION_TAG"
          docker buildx imagetools create \
            -t "$DST_REG/$BASE_REPOSITORY:$SHA_TAG" \
            "$DEV_REG/$BASE_REPOSITORY:$VERSION_TAG"

      - name: Configure prod AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::363694354866:role/github-actions-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish base image to prod ECR
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names "$BASE_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 ||
            aws ecr create-repository --repository-name "$BASE_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Login to prod registry
        id: prod-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy base image to prod
        shell: bash
        run: |
          VERSION_TAG="${{ github.event.inputs.tag || '2.0.0' }}"
          SHA_TAG="sha-$(git rev-parse --short HEAD)"
          DEV_REG="${{ steps.dev-login.outputs.registry }}"
          DST_REG="${{ steps.prod-login.outputs.registry }}"
          docker buildx imagetools create \
            -t "$DST_REG/$BASE_REPOSITORY:$VERSION_TAG" \
            "$DEV_REG/$BASE_REPOSITORY:$VERSION_TAG"
          docker buildx imagetools create \
            -t "$DST_REG/$BASE_REPOSITORY:$SHA_TAG" \
            "$DEV_REG/$BASE_REPOSITORY:$VERSION_TAG"
